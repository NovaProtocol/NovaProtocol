services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: novaprotocol_main
    restart: unless-stopped
    environment:
      DEPLOYMENT_TYPE: ${DEPLOYMENT_TYPE:?DEPLOYMENT_TYPE is required}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:7051/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - cloudflared-tunnel

  caddy:
    build:
      context: ./caddy
      dockerfile: Dockerfile
    container_name: novaprotocol_caddy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:7050/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    ports:
      - "127.0.0.1:7050:7050"
    networks:
      - cloudflared-tunnel

networks:
  cloudflared-tunnel:
    external: true
    name: cloudflared-tunnel_default
